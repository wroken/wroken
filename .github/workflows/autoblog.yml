name: Autoblog

on:
  push:
    paths: ["wordpress/**", ".github/workflows/autoblog.yml"]
  pull_request:
    paths: ["wordpress/**", ".github/workflows/autoblog.yml"]
  workflow_dispatch:

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wordpress/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  windows-scripts:
    name: Scripts de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis de los .ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $fail = $false
          Get-ChildItem wordpress\scripts\windows\*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $fail = $true; $errs | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
            else { Write-Host "OK $($_.Name)" }
          }
          if ($fail) { exit 1 }
      - name: Instalador (sin Claude instalado)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:APPDATA\Claude" | Out-Null
          & wordpress\scripts\windows\instalar.ps1
          $cfg = Get-Content "$env:APPDATA\Claude\claude_desktop_config.json" -Raw | ConvertFrom-Json
          if (-not $cfg.mcpServers.autoblog) { throw 'No registró autoblog en Claude Desktop' }
          if (-not (Test-Path wordpress\dist\autoblog.zip)) { throw 'No creó autoblog.zip' }
          Write-Host "Registrado: $($cfg.mcpServers.autoblog.args)"
      - name: Contraseña cifrada con DPAPI y descifrada por el servidor
        shell: powershell
        run: |
          $OutputEncoding = New-Object System.Text.UTF8Encoding $false
          $sec = ConvertTo-SecureString 'abcd efgh ijkl mnop' -AsPlainText -Force
          $enc = ConvertFrom-SecureString $sec
          @{ user = 'autoblog'; store = 'dpapi'; appPasswordDpapi = $enc } | ConvertTo-Json -Compress | node wordpress\mcp-server\src\cli.js set-site viajesok
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = node --input-type=module -e "import('./wordpress/mcp-server/src/config.js').then(m => { const c = m.getCredentials('viajesok'); console.log(c && c.appPassword === 'abcd efgh ijkl mnop' ? 'DPAPI-OK' : 'DPAPI-FAIL ' + JSON.stringify(c)); })"
          Write-Host $out
          if ($out -ne 'DPAPI-OK') { exit 1 }

  mac-scripts:
    name: Scripts de Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis
        run: for f in wordpress/scripts/mac/*.sh; do bash -n "$f" && echo "OK $f"; done
      - name: Instalador (sin Claude instalado)
        run: |
          bash wordpress/scripts/mac/instalar.sh
          grep -q autoblog "$HOME/Library/Application Support/Claude/claude_desktop_config.json"
          test -f wordpress/dist/autoblog.zip
      - name: Contraseña en el Llavero y leída por el servidor
        run: |
          security add-generic-password -U -s autoblog -a viajesok -w 'abcd efgh ijkl mnop'
          echo '{"user":"autoblog","store":"keychain"}' | node wordpress/mcp-server/src/cli.js set-site viajesok
          node --input-type=module -e "import('./wordpress/mcp-server/src/config.js').then(m => { const c = m.getCredentials('viajesok'); if (!c || c.appPassword !== 'abcd efgh ijkl mnop') { console.log('KEYCHAIN-FAIL'); process.exit(1) } console.log('KEYCHAIN-OK') })"

  wordpress-plugin:
    name: Plugin de WordPress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l wordpress/wp-plugin/autoblog-bridge/autoblog-bridge.php
